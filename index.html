<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 西岐城西方道堂之旅報名</title>
  <style>
    :root {
      --main: #0f80ad;
      --main-dark: #0a6388;
      --gold: #ffcc4d;
      --cream: #fffaf4;
      --paper: #fffefb;
      --blue-soft: #eef8ff;
      --blue-line: #c9e8f8;
      --orange-soft: #fff4e8;
      --orange-line: #ffd9b8;
      --pink-soft: #fff3f4;
      --pink-line: #ffd5da;
      --green-soft: #edf9f0;
      --green-line: #cbead1;
      --purple-soft: #f5f1ff;
      --purple-line: #dfd4ff;
      --gray-soft: #f6f7f8;
      --gray-line: #e0e4e8;
      --text: #23303a;
      --muted: #56616b;
      --shadow: 0 14px 36px rgba(15, 128, 173, 0.14);
      --success: #e8f9ee;
      --success-text: #1d6b3b;
      --error: #fff1f1;
      --error-text: #9b2c2c;
      --selected: #fff4c2;
      --selected-line: #ffb800;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 8%, rgba(255, 204, 77, 0.24), transparent 24%),
        radial-gradient(circle at 90% 12%, rgba(15, 128, 173, 0.18), transparent 24%),
        linear-gradient(180deg, #fffdf8 0%, #fff8ed 100%);
    }

    .page {
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      background:
        linear-gradient(135deg, rgba(15,128,173,0.96), rgba(41,159,193,0.92)),
        #0f80ad;
      color: white;
      padding: 28px 22px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      z-index: 0;
    }

    .hero::before {
      width: 300px;
      height: 300px;
      right: -120px;
      top: -80px;
    }

    .hero::after {
      width: 240px;
      height: 240px;
      left: -80px;
      bottom: -120px;
    }

    .hero-copy {
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-block;
      background: var(--gold);
      color: #513400;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      line-height: 1.18;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 12px 0 10px;
      font-size: 20px;
      line-height: 1.6;
      color: #eefaff;
      font-weight: 700;
    }

    .status-pill {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.30);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.38);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff4d4f;
      box-shadow: 0 0 0 0 rgba(255, 77, 79, 0.65);
      animation: livePulse 1.5s infinite;
    }

    @keyframes livePulse {
      0%   { box-shadow: 0 0 0 0 rgba(255, 77, 79, 0.6); }
      70%  { box-shadow: 0 0 0 9px rgba(255, 77, 79, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 77, 79, 0); }
    }

    .status-pill.closed {
      background: rgba(0, 0, 0, 0.34);
      color: #dfe4e8;
    }

    .status-pill.closed .live-dot {
      background: #9aa3aa;
      box-shadow: none;
      animation: none;
    }

    .top-note-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .top-note {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 14px;
      backdrop-filter: blur(8px);
    }

    .top-note b {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .top-note span {
      display: block;
      font-size: 16px;
      line-height: 1.45;
      color: #eefaff;
      font-weight: 700;
    }

    .fee-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 0 0 18px;
    }

    .fee-card {
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
      background: var(--orange-soft);
      border: 3px solid var(--orange-line);
    }

    .fee-card.self {
      background: var(--pink-soft);
      border-color: var(--pink-line);
    }

    .fee-top {
      margin-bottom: 8px;
      font-weight: 900;
      font-size: 22px;
      color: #7a4b00;
    }

    .fee-card.self .fee-top { color: #934857; }

    .fee-price {
      font-size: 22px;
      line-height: 1.6;
      font-weight: 900;
      color: #374151;
    }

    .accordion {
      margin-bottom: 18px;
      border: 3px solid #ffd978;
      border-radius: 22px;
      overflow: hidden;
      background: #fffaf0;
      box-shadow: var(--shadow);
    }

    .accordion > button {
      width: 100%;
      margin: 0;
      border: 0;
      background: #ffcc4d;
      color: #2a2a2a;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      font-weight: 900;
      padding: 18px;
      cursor: pointer;
    }

    .accordion-content {
      display: none;
      padding: 16px;
    }

    .accordion.open .accordion-content { display: block; }

    .box-heading {
      margin: 16px 0 8px;
      font-size: 20px;
      color: #125a78;
      font-weight: 900;
    }

    .box-heading:first-child { margin-top: 0; }

    .hero-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .hero-actions .status-pill { margin-top: 0; }

    .hero-details-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gold);
      color: #513400;
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 12px;
    }

    .hero-meta .badge { margin-bottom: 0; }

    .hero-copy h1 { padding-right: 104px; }

    .details-panel { margin: 0; }
    .details-panel .accordion-content { display: none; }
    .details-panel.open .accordion-content {
      display: block;
      margin-bottom: 18px;
      padding: 16px;
      border: 3px solid #ffd978;
      border-radius: 22px;
      background: #fffaf0;
      box-shadow: var(--shadow);
    }

    .reveal-block { display: none; }
    .reveal-block.show { display: block; }

    .pickup-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 16px 18px;
      border: 3px solid var(--blue-line);
      border-radius: 18px;
      background: #fff;
      color: #125a78;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
    }

    .pickup-section { display: none; padding-top: 14px; }
    .pickup-section.open { display: block; }

    .hero-steps {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      line-height: 1.6;
    }

    .hero-steps b {
      display: block;
      font-size: 16px;
      color: #fff;
      margin-bottom: 2px;
    }

    .hero-steps span {
      display: block;
      font-size: 17px;
      font-weight: 800;
      color: #eefaff;
    }

    .route-item {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 10px;
      background: #ffffff;
      border: 3px solid #f1e2bd;
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .time {
      color: #125a78;
      font-size: 20px;
      font-weight: 900;
    }

    .place {
      font-size: 19px;
      line-height: 1.5;
      font-weight: 700;
    }

    .place-addr {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
      color: #7a8791;
    }

    .wizard-card {
      background: var(--paper);
      border-radius: 30px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 2px solid #f4f0e8;
      margin-bottom: 18px;
    }

    .progress-wrap {
      background: var(--gray-soft);
      border: 2px solid var(--gray-line);
      border-radius: 24px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .progress-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .progress-step {
      border-radius: 18px;
      padding: 12px 8px;
      text-align: center;
      background: #ffffff;
      border: 3px solid #e5e9ec;
      color: #77818a;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.35;
    }

    .progress-step.active {
      background: var(--selected);
      border-color: var(--selected-line);
      color: #6b4a00;
    }

    .progress-step.done {
      background: var(--green-soft);
      border-color: var(--green-line);
      color: #1d6b3b;
    }

    .bar {
      height: 12px;
      background: #e5e9ec;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      width: 33.33%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--main));
      border-radius: 999px;
      transition: width .25s ease;
    }

    .step-panel { display: none; }
    .step-panel.active { display: block; }

    .step-title {
      margin: 0 0 8px;
      font-size: 32px;
      color: #125a78;
      font-weight: 900;
    }

    .step-sub {
      margin: 0 0 18px;
      font-size: 19px;
      font-weight: 700;
      color: var(--muted);
      line-height: 1.6;
    }

    label.section-label {
      display: block;
      font-size: 24px;
      color: #1f2933;
      font-weight: 900;
      margin: 16px 0 8px;
    }

    .hint {
      font-size: 18px;
      line-height: 1.5;
      color: var(--muted);
      font-weight: 700;
      margin: -2px 0 10px;
      background: var(--blue-soft);
      border: 2px solid var(--blue-line);
      border-radius: 18px;
      padding: 12px;
    }

    textarea {
      width: 100%;
      min-height: 210px;
      padding: 16px;
      border-radius: 18px;
      border: 3px solid #b9d7e6;
      font-size: 23px;
      line-height: 1.55;
      font-family: inherit;
      resize: vertical;
      outline: none;
      background: #fff;
    }

    textarea:focus {
      border-color: var(--main);
      box-shadow: 0 0 0 4px rgba(15, 128, 173, 0.16);
    }

    .pickup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .pickup-btn {
      min-height: 132px;
      border: 4px solid var(--blue-line);
      border-radius: 22px;
      background: var(--blue-soft);
      color: #17465c;
      padding: 14px 10px;
      font-size: 21px;
      line-height: 1.25;
      font-weight: 900;
      cursor: pointer;
      box-shadow: none;
      margin: 0;
      text-align: center;
    }

    .pickup-btn small {
      display: block;
      margin-top: 6px;
      font-size: 15px;
      line-height: 1.35;
      color: #52636c;
      font-weight: 800;
    }

    .pickup-btn.active {
      background: var(--selected);
      border-color: var(--selected-line);
      color: #6b4a00;
      transform: translateY(-1px);
    }

    .pickup-btn.full { opacity: 0.55; }

    .confirm-box {
      border-radius: 24px;
      padding: 18px;
      background: var(--blue-soft);
      border: 3px solid var(--blue-line);
      margin-bottom: 14px;
    }

    .confirm-box h3 {
      margin: 0 0 10px;
      font-size: 24px;
      color: #125a78;
    }

    .confirm-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px dashed #b5d4e3;
      font-size: 20px;
      line-height: 1.5;
      font-weight: 800;
    }

    .confirm-row:last-child { border-bottom: 0; }

    .confirm-label { color: #52636c; }
    .confirm-value { color: #24313b; }

    .name-list {
      margin: 0;
      padding-left: 1.3em;
      font-size: 20px;
      line-height: 1.7;
      font-weight: 800;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    .actions.single {
      grid-template-columns: 1fr;
    }

    .btn {
      width: 100%;
      padding: 19px 14px;
      border: none;
      border-radius: 22px;
      font-size: 25px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(15, 128, 173, 0.16);
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--main), var(--main-dark));
      color: white;
    }

    .btn-secondary {
      background: #ffffff;
      color: #125a78;
      border: 3px solid var(--blue-line);
      box-shadow: none;
    }

    .btn:disabled {
      background: #aaa;
      color: white;
      cursor: not-allowed;
      box-shadow: none;
      border: none;
    }

    .notice {
      margin-top: 18px;
      padding: 16px;
      border-radius: 18px;
      background: var(--green-soft);
      border: 2px solid var(--green-line);
      color: #3a5f42;
      font-size: 17px;
      line-height: 1.7;
      font-weight: 700;
      white-space: pre-line;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      font-size: 20px;
      line-height: 1.7;
      background: var(--success);
      color: var(--success-text);
      font-weight: 800;
    }

    .result.error {
      background: var(--error);
      color: var(--error-text);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    .mode-btn {
      padding: 24px 16px;
      border-radius: 24px;
      border: 3px solid;
      font-size: 26px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(15, 128, 173, 0.14);
    }

    .mode-btn.signup {
      background: #eaf7ff;
      border-color: #bfe5f6;
      color: #0a6388;
    }

    .mode-btn.query {
      background: #fff6e3;
      border-color: #ffd978;
      color: #a06a00;
    }

    .mode-btn.active.signup {
      background: linear-gradient(180deg, var(--main), var(--main-dark));
      border-color: var(--main-dark);
      color: #fff;
    }

    .mode-btn.active.query {
      background: linear-gradient(180deg, #ffcc4d, #f0a500);
      border-color: #e09a00;
      color: #4a3000;
    }

    .mode-panel { display: none; }
    .mode-panel.show { display: block; }

    .col-card {
      border-radius: 28px;
      padding: 22px;
      border: 3px solid #f4f0e8;
      background: var(--paper);
      box-shadow: 0 16px 40px rgba(15, 128, 173, 0.16);
    }

    .col-card.signup {
      background: #f2fbff;
      border-color: #bfe5f6;
    }

    .col-card.query {
      background: #fffaf0;
      border-color: #ffd978;
    }

    .col-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      padding-bottom: 12px;
      font-size: 28px;
      font-weight: 900;
      color: #125a78;
      border-bottom: 3px dashed transparent;
    }

    .col-card.signup .col-title {
      color: #0a6388;
      border-bottom-color: #bfe5f6;
    }

    .col-card.query .col-title {
      color: #a06a00;
      border-bottom-color: #ffd978;
    }

    .query-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    #queryName {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 16px;
      border: 3px solid #b9d7e6;
      font-size: 20px;
      font-family: inherit;
      outline: none;
      background: #fff;
    }

    #queryName:focus {
      border-color: var(--main);
      box-shadow: 0 0 0 4px rgba(15, 128, 173, 0.16);
    }

    .query-btn {
      width: auto;
      flex: 0 0 auto;
      padding: 14px 22px;
      font-size: 20px;
      border-radius: 16px;
    }

    .query-result { margin-top: 16px; }

    .qr-card {
      border-radius: 20px;
      padding: 16px;
      background: var(--blue-soft);
      border: 3px solid var(--blue-line);
      margin-bottom: 12px;
    }

    .qr-bus {
      font-size: 30px;
      font-weight: 900;
      color: #0a6388;
      margin-bottom: 8px;
    }

    .qr-row {
      font-size: 18px;
      line-height: 1.6;
      font-weight: 700;
      color: #24313b;
    }

    .qr-label { color: #52636c; }

    .qr-empty {
      padding: 14px;
      border-radius: 16px;
      background: var(--error);
      color: var(--error-text);
      font-size: 18px;
      font-weight: 800;
    }

    .roster-card {
      background: var(--paper);
      border-radius: 30px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 2px solid #f4f0e8;
      margin-bottom: 18px;
    }

    .roster-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 0;
      padding: 0;
      cursor: pointer;
      font-size: 28px;
      font-weight: 900;
      color: #125a78;
    }

    .roster-body { display: none; margin-top: 14px; }
    .roster-body.show { display: block; }

    .bus-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 16px;
    }

    .bus-tab {
      padding: 10px 16px;
      border-radius: 999px;
      border: 3px solid var(--blue-line);
      background: #fff;
      color: #125a78;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .bus-tab.active {
      background: var(--selected);
      border-color: var(--selected-line);
      color: #6b4a00;
    }

    .roster-list { font-size: 18px; }

    .roster-names {
      margin: 8px 0 0;
      padding-left: 1.4em;
      line-height: 1.8;
      font-weight: 800;
      columns: 2;
    }

    .roster-empty { color: var(--muted); font-weight: 700; }

    .qr-banner {
      font-size: 20px;
      font-weight: 800;
      color: #24313b;
      margin-bottom: 12px;
    }

    .bus-sheet {
      border: 3px solid var(--blue-line);
      border-radius: 20px;
      padding: 16px;
      background: #fff;
    }

    .bs-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }

    .bs-bus {
      font-size: 30px;
      font-weight: 900;
      color: #0a6388;
    }

    .bs-count {
      font-size: 18px;
      font-weight: 800;
      color: #52636c;
    }

    .bs-line {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.6;
      color: #24313b;
      margin-bottom: 6px;
    }

    .bs-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 18px;
      font-size: 17px;
      font-weight: 800;
      color: #24313b;
      margin-bottom: 4px;
    }

    .bs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .bs-seat {
      background: #f6fbfe;
      border: 2px solid var(--blue-line);
      border-radius: 12px;
      padding: 10px 8px;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
    }

    .bs-seat.me {
      background: var(--selected);
      border-color: var(--selected-line);
      color: #6b4a00;
    }

    .bs-no {
      display: inline-block;
      min-width: 1.6em;
      color: #0a6388;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin: 18px 0 6px;
    }

    @media (max-width: 760px) {
      h1 { font-size: 34px; }
      .subtitle { font-size: 19px; }
      .two-col { grid-template-columns: 1fr; }
      .roster-names { columns: 1; }
      .bs-grid { grid-template-columns: repeat(2, 1fr); }
      .fee-grid, .top-note-grid {
        grid-template-columns: 1fr;
      }

      .progress-steps {
        grid-template-columns: 1fr;
      }

      .progress-step {
        text-align: left;
        padding-left: 14px;
      }
    }

    @media (max-width: 560px) {
      .page { padding: 12px; }
      .hero, .wizard-card, .fee-card { border-radius: 22px; }
      .pickup-grid {
        grid-template-columns: 1fr 1fr;
      }
      .pickup-btn {
        min-height: 120px;
        font-size: 19px;
      }
      .pickup-btn small { font-size: 13px; }
      textarea { font-size: 21px; }
      .actions {
        grid-template-columns: 1fr;
      }
      .confirm-row {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }

    @media (max-width: 400px) {
      .pickup-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="container">

      <section class="hero">
        <div id="statusPill" class="status-pill">
          <span class="live-dot"></span>
          <span id="statusText">報名開放中</span>
        </div>
        <div class="hero-copy">
          <h1 id="activityTitle">2026 屏東西岐城、西方道堂之旅</h1>

          <div class="hero-meta">
            <div id="dateBadge" class="badge">活動時間：2026.11.8 星期日</div>
            <button type="button" class="hero-details-btn" onclick="toggleAccordion('detailsBox','detailsIcon')">
              查看行程與費用 <span id="detailsIcon">＋</span>
            </button>
          </div>

          <p id="activitySubtitle" class="subtitle">請輸入姓名並選擇上車地點。可以一次報名多人，一行一個姓名。</p>

          <div class="hero-steps">
            <b>操作順序</b>
            <span>① 輸入姓名　→　② 選擇上車地點　→　③ 送出報名</span>
          </div>
        </div>
      </section>

      <section id="detailsBox" class="details-panel">
        <div class="accordion-content">
          <h3 class="box-heading">費用</h3>
          <div class="fee-grid">
            <div class="fee-card">
              <div class="fee-top">遊覽車費用</div>
              <div id="busFee" class="fee-price">大人 $1100｜小孩 $900</div>
            </div>
            <div class="fee-card self">
              <div class="fee-top">屏東自行開車</div>
              <div id="selfDriveFee" class="fee-price">大人 $800｜小孩 $600</div>
            </div>
          </div>

          <h3 class="box-heading">行程</h3>
          <div id="itineraryList">
            <div class="route-item"><div class="time">08:00</div><div class="place">各上車地點集合出發</div></div>
          </div>

          <h3 class="box-heading">注意事項</h3>
          <div id="noticeBox" class="notice">
            費用包含午餐、水2瓶、下午茶、香火錢、車資。
            請著輕便服裝、運動鞋方便靈動參拜。
          </div>
        </div>
      </section>

      <section class="mode-switch">
        <button type="button" id="tabSignup" class="mode-btn signup" onclick="setMode('signup')">📝 報名登記</button>
        <button type="button" id="tabQuery" class="mode-btn query" onclick="setMode('query')">🔍 查詢車次</button>
      </section>

      <div id="signupPanel" class="mode-panel">
        <div class="col-card signup">
          <form id="signupForm">
            <label class="section-label" for="names">① 報名姓名（一行一個人）</label>
            <textarea id="names" name="names" placeholder="請輸入姓名，一行一個人&#10;例如：&#10;呂佩恩&#10;呂元訓&#10;李秀鳳"></textarea>

            <div id="afterNameBlock" class="reveal-block">
              <button type="button" id="pickupToggle" class="pickup-toggle" onclick="togglePickup()">
                <span>② 選擇上車地點</span>
                <span id="pickupIcon">＋</span>
              </button>

              <div id="pickupSection" class="pickup-section">
                <div id="pickupGrid" class="pickup-grid"></div>

                <div class="actions single">
                  <button id="submitBtn" class="btn btn-primary" type="submit">送出報名</button>
                </div>
              </div>
            </div>
          </form>

          <div id="result" class="result"></div>
        </div>
      </div>

      <div id="queryPanel" class="mode-panel">
        <div class="col-card query">
          <label class="section-label" for="queryName">輸入你的姓名，查你的車次與車表</label>
          <div class="query-row">
            <input id="queryName" type="text" placeholder="輸入姓名" autocomplete="off" />
            <button type="button" class="btn btn-primary query-btn" onclick="doQuery()">查詢</button>
          </div>
          <div id="queryResult" class="query-result"></div>
        </div>

        <section class="roster-card">
          <button type="button" class="roster-toggle" onclick="toggleRoster()">
            <span>🚌 各車次名單</span>
            <span id="rosterIcon">＋</span>
          </button>
          <div id="rosterBody" class="roster-body">
            <p class="step-sub">點選車次，查看該車的報名名單。</p>
            <div id="busTabs" class="bus-tabs"></div>
            <div id="rosterList" class="roster-list"></div>
          </div>
        </section>
      </div>

      <div class="footer">西岐城活動報名系統</div>
    </div>
  </main>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVoaHKG4EqVODn_W7TX2Cb3KGbQKJY-5dgL4-r35g3eBGBlqNJELBVFEnd0ztxc5Yx/exec";

    const DEFAULT_DATA = {
      status: "success",
      activity: {
        title: "2026 屏東西岐城、西方道堂之旅",
        date: "2026.11.8 星期日",
        subtitle: "請輸入姓名並選擇上車地點。可以一次報名多人，一行一個姓名。",
        registrationStatus: "開放",
        busAdultFee: "1100",
        busChildFee: "900",
        selfDriveAdultFee: "800",
        selfDriveChildFee: "600",
        feeIncludes: "費用包含午餐、水2瓶、下午茶、香火錢、車資。",
        notes: "請著輕便服裝、運動鞋方便靈動參拜。",
        xiqichengAddress: "屏東縣長治鄉新興路99巷73號",
        xifangAddress: "屏東縣萬巒鄉新厝村富山路1號",
        lunchAddress: "新和喜宴會館－屏東縣長治鄉繁昌村振興路16-11號（08-7623889）"
      },
      itinerary: [
        { time: "08:00", content: "高雄道場＋高雄文化中心＋台南永康出發" },
        { time: "09:00", content: "屏東西岐城" },
        { time: "12:30", content: "午餐：新和喜宴會館" },
        { time: "14:00", content: "西方道堂" },
        { time: "17:30", content: "快樂返家" }
      ],
      pickups: [
        { name: "高雄文化中心", departureTime: "早上8:00", busLabel: "1.2.6.7.8.9車", location: "五福路大門口", remaining: 258, capacity: 258, selfDrive: false },
        { name: "高雄道場三多", departureTime: "早上8:00", busLabel: "3.12車", location: "三多路全家便利商店前", remaining: 86, capacity: 86, selfDrive: false },
        { name: "高雄道場85大樓", departureTime: "早上8:00", busLabel: "5.10車", location: "三多路85大樓門口", remaining: 86, capacity: 86, selfDrive: false },
        { name: "台南永康", departureTime: "早上8:00", busLabel: "11車", location: "合眾汽車台南營業所（億峰家俱對面）", remaining: 43, capacity: 43, selfDrive: false },
        { name: "屏東自行開車", departureTime: "自行前往", busLabel: "自行開車", location: "不占遊覽車座位", remaining: "不限", capacity: "不限", selfDrive: true }
      ]
    };

    let selectedPickup = "";
    let latestData = DEFAULT_DATA;
    let currentStep = 1;

    const form = document.getElementById("signupForm");
    const resultBox = document.getElementById("result");
    const submitBtn = document.getElementById("submitBtn");
    const afterNameBlock = document.getElementById("afterNameBlock");

    document.getElementById("names").addEventListener("input", updateRevealState);

    function updateRevealState() {
      const hasName = getCurrentNames().length > 0;
      afterNameBlock.classList.toggle("show", hasName);
      if (!hasName) {
        document.getElementById("pickupSection").classList.remove("open");
        document.getElementById("pickupIcon").textContent = "＋";
      }
    }

    function togglePickup() {
      const section = document.getElementById("pickupSection");
      const open = section.classList.toggle("open");
      document.getElementById("pickupIcon").textContent = open ? "－" : "＋";
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderPage(DEFAULT_DATA);
      loadStatus();
      loadRoster();
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const names = getCurrentNames();

      if (names.length === 0) {
        showMessage("請至少輸入一個姓名。", true);
        return;
      }

      if (!selectedPickup) {
        showMessage("請選擇上車地點。", true);
        return;
      }

      if (latestData.activity && latestData.activity.registrationStatus !== "開放") {
        showMessage("目前尚未開放報名，請聯絡工作人員。", true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "送出中...";

      try {
        if (!GOOGLE_SCRIPT_URL) {
          showMessage(
            `測試報名成功：<br>
             上車地點：${escapeHtml(selectedPickup)}<br>
             報名人數：${names.length} 人<br>
             名單：<br>${names.map(escapeHtml).join("<br>")}<br><br>
             目前尚未串接 Google Sheet，所以資料不會真的寫入後台。`
          );
          form.reset();
          clearPickupSelection();
          updateRevealState();
          return;
        }

        const response = await jsonp(GOOGLE_SCRIPT_URL, {
          action: "submit",
          names: names.join("\n"),
          pickup: selectedPickup
        });

        if (response.status === "success") {
          const listHtml = response.records.map(function (record) {
            const assignText = record.selfDrive
              ? "自行開車"
              : `${escapeHtml(record.busNo)}／第 ${record.seatNo} 位`;

            return `${escapeHtml(record.name)}：${assignText}（${escapeHtml(record.registrationNo)}）`;
          }).join("<br>");

          showMessage(
            `報名成功！<br>
             上車地點：${escapeHtml(response.pickup)}<br>
             報名人數：${response.count} 人<br><br>
             ${listHtml}`
          );

          form.reset();
          clearPickupSelection();
          updateRevealState();
          loadStatus();
          loadRoster();
        } else if (response.status === "full") {
          showMessage(
            `${escapeHtml(response.pickup)} 名額不足。<br>
             目前剩餘：${response.remaining} 位<br>
             本次報名：${response.requested} 人`,
            true
          );
          loadStatus();
        } else if (response.status === "closed") {
          showMessage("目前報名尚未開放或已關閉。", true);
          loadStatus();
        } else {
          showMessage(response.message || "送出失敗，請稍後再試。", true);
        }
      } catch (error) {
        showMessage("送出失敗，請確認 Apps Script 網址是否正確，或稍後再試。", true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "送出報名";
      }
    });

    let rosterData = [];
    let busInfoData = {};

    function setMode(mode) {
      const isSignup = mode === "signup";
      document.getElementById("signupPanel").classList.toggle("show", isSignup);
      document.getElementById("queryPanel").classList.toggle("show", !isSignup);
      document.getElementById("tabSignup").classList.toggle("active", isSignup);
      document.getElementById("tabQuery").classList.toggle("active", !isSignup);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function doQuery() {
      const name = document.getElementById("queryName").value.trim();
      const box = document.getElementById("queryResult");

      if (!name) {
        box.innerHTML = `<div class="qr-empty">請先輸入姓名。</div>`;
        return;
      }

      box.innerHTML = `<div class="qr-row">查詢中…</div>`;

      try {
        const res = await jsonp(GOOGLE_SCRIPT_URL, { action: "query", name: name });
        if (!res || !res.matches) {
          box.innerHTML = `<div class="qr-empty">查詢功能尚未啟用，請先重新部署後台。</div>`;
          return;
        }
        renderQueryResult(name, res.matches);
      } catch (error) {
        box.innerHTML = `<div class="qr-empty">查詢失敗，請稍後再試。</div>`;
      }
    }

    function renderQueryResult(name, matches) {
      const box = document.getElementById("queryResult");

      if (!matches.length) {
        box.innerHTML = `<div class="qr-empty">查無「${escapeHtml(name)}」的報名資料，請確認姓名是否正確。</div>`;
        return;
      }

      const busNo = matches[0].busNo;
      const busLabel = String(busNo).indexOf("自行") >= 0 ? "自行開車" : busNo;
      box.innerHTML = `
        <div class="qr-banner">${escapeHtml(name)}　在　<b>${escapeHtml(busLabel)}</b></div>
        <div id="queryBusSheet"></div>
      `;
      renderBusSheet(busNo, document.getElementById("queryBusSheet"), name);
    }

    async function loadRoster() {
      try {
        const res = await jsonp(GOOGLE_SCRIPT_URL, { action: "roster" });
        rosterData = (res && res.roster) ? res.roster : [];
        busInfoData = buildBusInfo(res && res.buses ? res.buses : []);
      } catch (error) {
        rosterData = [];
        busInfoData = {};
      }
      renderBusTabs();
    }

    function buildBusInfo(list) {
      const map = {};
      (list || []).forEach(function (b) {
        if (b && b.busNo) map[b.busNo] = b;
      });
      return map;
    }

    function toggleRoster() {
      const body = document.getElementById("rosterBody");
      const open = body.classList.toggle("show");
      document.getElementById("rosterIcon").textContent = open ? "－" : "＋";
    }

    function busSortKey(busNo) {
      const text = String(busNo || "");
      if (text.indexOf("自行") >= 0) return 9999;
      const match = text.match(/\d+/);
      return match ? Number(match[0]) : 9998;
    }

    function renderBusTabs() {
      const tabs = document.getElementById("busTabs");
      const list = document.getElementById("rosterList");

      if (!rosterData.length) {
        tabs.innerHTML = "";
        list.innerHTML = `<div class="roster-empty">目前尚無名單（或後台尚未啟用查詢功能）。</div>`;
        return;
      }

      const buses = [];
      rosterData.forEach(function (r) {
        if (buses.indexOf(r.busNo) < 0) buses.push(r.busNo);
      });
      buses.sort(function (a, b) { return busSortKey(a) - busSortKey(b); });

      tabs.innerHTML = buses.map(function (bus) {
        return `<button type="button" class="bus-tab" data-bus="${escapeHtml(bus)}" onclick="selectBus(this.dataset.bus)">${escapeHtml(bus)}</button>`;
      }).join("");

      list.innerHTML = `<div class="roster-empty">請點選上方車次，查看該車名單。</div>`;
    }

    function selectBus(bus) {
      document.querySelectorAll(".bus-tab").forEach(function (tab) {
        tab.classList.toggle("active", tab.dataset.bus === bus);
      });
      renderBusSheet(bus, document.getElementById("rosterList"), "");
    }

    function renderBusSheet(busNo, container, highlightName) {
      if (!container) return;

      const people = rosterData
        .filter(function (r) { return r.busNo === busNo; })
        .sort(function (a, b) { return (Number(a.seatNo) || 0) - (Number(b.seatNo) || 0); });

      if (!people.length) {
        container.innerHTML = `<div class="roster-empty">這個車次目前沒有名單。</div>`;
        return;
      }

      const isSelf = String(busNo).indexOf("自行") >= 0;
      const info = busInfoData[busNo] || {};
      const pickupName = people[0].pickup;
      const pickups = latestData.pickups || DEFAULT_DATA.pickups;
      const pickup = pickups.find(function (p) { return p.name === pickupName; }) || {};

      const seats = people.map(function (p, i) {
        const no = isSelf ? "" : (Number(p.seatNo) || (i + 1));
        const cls = (highlightName && p.name === highlightName) ? "bs-seat me" : "bs-seat";
        return `<div class="${cls}">${isSelf ? "" : `<span class="bs-no">${no}</span>`}${escapeHtml(p.name)}</div>`;
      }).join("");

      const metaRows = isSelf ? "" : `
        <div class="bs-meta"><span>車長：${escapeHtml(info.captain || "—")}</span><span>副車長：${escapeHtml(info.viceCaptain || "—")}</span></div>
        <div class="bs-meta"><span>車號：${escapeHtml(info.plate || "—")}</span><span>司機：${escapeHtml(info.driver || "—")}</span><span>電話：${escapeHtml(info.driverPhone || "—")}</span></div>
      `;

      container.innerHTML = `
        <div class="bus-sheet">
          <div class="bs-head">
            <span class="bs-bus">${escapeHtml(isSelf ? "自行開車" : busNo)}</span>
            <span class="bs-count">共 ${people.length} 人</span>
          </div>
          <div class="bs-line"><b>出發：</b>${escapeHtml(pickup.departureTime || "")}　${escapeHtml(pickupName)}${pickup.location ? "（" + escapeHtml(pickup.location) + "）" : ""}</div>
          ${metaRows}
          <div class="bs-grid">${seats}</div>
        </div>
      `;
    }

    async function loadStatus() {
      if (!GOOGLE_SCRIPT_URL) {
        latestData = DEFAULT_DATA;
        renderPage(DEFAULT_DATA);
        return;
      }

      try {
        const response = await jsonp(GOOGLE_SCRIPT_URL, { action: "status" });
        if (response.status === "success") {
          latestData = response;
          renderPage(response);
        } else {
          latestData = DEFAULT_DATA;
          renderPage(DEFAULT_DATA);
        }
      } catch (error) {
        latestData = DEFAULT_DATA;
        renderPage(DEFAULT_DATA);
      }
    }

    function renderPage(data) {
      const activity = data.activity || DEFAULT_DATA.activity;

      document.getElementById("activityTitle").textContent = activity.title || DEFAULT_DATA.activity.title;
      document.getElementById("dateBadge").textContent = "活動時間：" + (activity.date || "2026.11.8 星期日");
      document.getElementById("activitySubtitle").textContent = activity.subtitle || DEFAULT_DATA.activity.subtitle;

      document.getElementById("busFee").textContent =
        `大人 $${activity.busAdultFee || "1100"}｜小孩 $${activity.busChildFee || "900"}`;

      document.getElementById("selfDriveFee").textContent =
        `大人 $${activity.selfDriveAdultFee || "800"}｜小孩 $${activity.selfDriveChildFee || "600"}`;

      const statusPill = document.getElementById("statusPill");
      const statusText = document.getElementById("statusText");
      if ((activity.registrationStatus || "開放") === "開放") {
        statusText.textContent = "報名開放中";
        statusPill.classList.remove("closed");
        submitBtn.disabled = false;
      } else {
        statusText.textContent = "報名已關閉";
        statusPill.classList.add("closed");
        submitBtn.disabled = true;
      }

      document.getElementById("noticeBox").textContent =
        `${activity.feeIncludes || ""}\n${activity.notes || ""}`;

      renderItinerary(data.itinerary || DEFAULT_DATA.itinerary);
      renderPickups(data.pickups || DEFAULT_DATA.pickups);
    }

    function renderItinerary(items) {
      const container = document.getElementById("itineraryList");
      const activity = latestData.activity || DEFAULT_DATA.activity;
      container.innerHTML = items.map(function (item) {
        const content = item.content || "";
        const address = itineraryAddress(content, activity);
        const addressHtml = address
          ? `<div class="place-addr">${escapeHtml(address)}</div>`
          : "";
        return `
          <div class="route-item">
            <div class="time">${escapeHtml(formatTime(item.time))}</div>
            <div class="place">${escapeHtml(content)}${addressHtml}</div>
          </div>
        `;
      }).join("");
    }

    function itineraryAddress(content, activity) {
      const d = DEFAULT_DATA.activity;
      if (content.indexOf("西岐城") >= 0) return activity.xiqichengAddress || d.xiqichengAddress || "";
      if (content.indexOf("西方道堂") >= 0) return activity.xifangAddress || d.xifangAddress || "";
      if (content.indexOf("新和喜宴") >= 0 || content.indexOf("午餐") >= 0) {
        return stripVenuePrefix_(activity.lunchAddress || d.lunchAddress || "");
      }
      return "";
    }

    function stripVenuePrefix_(text) {
      const idx = String(text).indexOf("－");
      return idx >= 0 ? text.slice(idx + 1).trim() : text;
    }

    function formatTime(value) {
      if (value === null || value === undefined || value === "") return "";
      const text = String(value).trim();
      if (/^\d{1,2}:\d{2}/.test(text)) return text;
      const date = new Date(text);
      if (!isNaN(date.getTime())) {
        const hh = String(date.getHours()).padStart(2, "0");
        const mm = String(date.getMinutes()).padStart(2, "0");
        return `${hh}:${mm}`;
      }
      return text;
    }

    function renderPickups(pickups) {
      const grid = document.getElementById("pickupGrid");
      grid.innerHTML = "";

      pickups.forEach(function (pickup) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pickup-btn";
        btn.dataset.pickup = pickup.name;

        const remainText = pickup.selfDrive
          ? `已登記 ${pickup.used || 0} 人｜不限`
          : `剩 ${pickup.remaining} / ${pickup.capacity} 位`;

        btn.innerHTML = `
          ${escapeHtml(pickup.name)}
          <small>${escapeHtml(pickup.departureTime || "")}｜${escapeHtml(pickup.busLabel || "")}</small>
          <small>${escapeHtml(pickup.location || "")}</small>
          <small>${escapeHtml(remainText)}</small>
        `;

        if (!pickup.selfDrive && Number(pickup.remaining) <= 0) {
          btn.classList.add("full");
        }

        if (pickup.name === selectedPickup) {
          btn.classList.add("active");
        }

        btn.addEventListener("click", function () {
          selectedPickup = pickup.name;
          document.querySelectorAll(".pickup-btn").forEach(function (button) {
            button.classList.remove("active");
          });
          btn.classList.add("active");
          hideMessage();
        });

        grid.appendChild(btn);
      });
    }

    function getCurrentNames() {
      return splitNames(document.getElementById("names").value.trim());
    }

    function splitNames(text) {
      return text
        .split(/\r?\n/)
        .map(function (name) { return name.trim(); })
        .filter(function (name) { return name.length > 0; });
    }

    function findPickup(name) {
      const pickups = latestData.pickups || DEFAULT_DATA.pickups;
      return pickups.find(function (pickup) {
        return pickup.name === name;
      });
    }

    function clearPickupSelection() {
      selectedPickup = "";
      document.querySelectorAll(".pickup-btn").forEach(function (btn) {
        btn.classList.remove("active");
      });
    }

    function toggleAccordion(boxId, iconId) {
      const box = document.getElementById(boxId);
      const icon = document.getElementById(iconId);
      box.classList.toggle("open");
      icon.textContent = box.classList.contains("open") ? "－" : "＋";
    }

    function showMessage(message, isError = false) {
      resultBox.innerHTML = message;
      resultBox.className = isError ? "result error" : "result";
      resultBox.style.display = "block";
      resultBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function hideMessage() {
      resultBox.style.display = "none";
    }

    function jsonp(url, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = "jsonpCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");
        const query = new URLSearchParams({
          ...params,
          callback: callbackName
        });

        window[callbackName] = function (data) {
          resolve(data);
          cleanup();
        };

        script.onerror = function () {
          reject(new Error("JSONP request failed"));
          cleanup();
        };

        function cleanup() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.src = url + (url.includes("?") ? "&" : "?") + query.toString();
        document.body.appendChild(script);
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
